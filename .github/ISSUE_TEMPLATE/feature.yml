name: Feature request
description: Propose a durable configuration, skill, eval, or workflow improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What durable user or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful design and its scope.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Link relevant official guidance, failures, or representative eval cases.
