name: CI

on:
  push:
    branches: [linux, windows, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Parse and validate portable configuration
        run: python -B scripts/bootstrap_codex_environment.py --validate-only
      - name: Validate Codex compatibility contract
        run: python -B scripts/validate-compatibility.py
      - name: Validate custom skill integrity
        run: python -B scripts/validate-skills.py
      - name: Test custom skill validation
        run: python -B scripts/test-validate-skills.py
      - name: Test bootstrap safety
        run: python -B scripts/test-bootstrap-config.py
      - name: Test hook protocols
        run: python -B scripts/test-codex-hooks.py
      - name: Require a clean worktree after validation
        shell: bash
        run: git diff --exit-code && test -z "$(git status --short)"

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  branch-parity:
    name: Linux / Windows durable-path parity
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch parity branches
        run: git fetch --no-tags origin linux windows
      - name: Compare durable setup trees
        run: python -B scripts/check_branch_sync.py --branches origin/linux origin/windows
